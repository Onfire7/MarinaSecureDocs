# Netlify build config for the MarinaSecure app (see README — Deployment).
#
# The site builds from the repo root; docs/ stays on GitHub Pages. Branch
# deploys of `beta` give a stable preview origin.
#
# Required environment variables (Netlify UI → Site settings → Environment):
#   VITE_CLERK_PUBLISHABLE_KEY  — public by design (pk_...)
#   VITE_SUPABASE_URL           — the marina's Supabase project
#   VITE_SUPABASE_ANON_KEY      — public by design; grants nothing on its own,
#                                 because RLS evaluates against the Clerk JWT
#   VITE_POWERSYNC_URL          — the marina's PowerSync instance
#
# Never add CLERK_SECRET_KEY, POWERSYNC_DB_PASSWORD, or a Supabase service_role
# key here; the frontend build must not see any of them.
#
# The origin-allowlist trap that used to live here was InstantDB's. Its
# successor is not a build setting at all: Supabase must trust Clerk as a
# third-party auth provider, and PowerSync must accept the token's `aud` — see
# scripts/provision-supabase.sh, stages 3, 4 and 8.

[build]
  # pnpm is detected from pnpm-lock.yaml; the exact version comes from
  # package.json's "packageManager" field via Corepack (which rejects semver
  # ranges there, so it must stay pinned exactly).
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20.19+ / 22.12+.
  NODE_VERSION = "22"
  # Every VITE_ value is compiled into the public bundle on purpose; without
  # this, Netlify's secrets scanner sees them in the output and fails the
  # build. Only add a name here that is genuinely public — the scanner is the
  # last thing standing between a pasted secret and a published bundle.
  SECRETS_SCAN_OMIT_KEYS = "VITE_CLERK_PUBLISHABLE_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_POWERSYNC_URL"

# Single-page app: react-router owns all paths (including /checkin/:guidUrl
# deep links from NFC tags/QR codes), so every URL serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
